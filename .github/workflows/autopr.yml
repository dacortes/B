name: AutoPR Description
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-description:
    if: github.event.label.name == 'generate-description'
    runs-on: ubuntu-latest
    steps:
      - name: Clean AutoPR cache
        run: |
          rm -rf ~/.local/share/autopr || true
          rm -rf /tmp/autopr-* || true
          rm -rf ~/.cache/autopr || true
          
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Añadir esto para PRs desde forks
          # allow-unsafe-pr-checkout: true

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Deshabilitar la verificación SSL para resolver problemas de Git
          git config --global http.sslVerify false
          
      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
          git branch -a
          
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AutoPR
        run: npm install -g autopr

      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Variables para AutoPR
          AUTOPR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOPR_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Setup del entorno para AutoPR
          export GIT_DIR="$(pwd)/.git"
          export GIT_WORK_TREE="$(pwd)"
          
          echo "=== Debug Info ==="
          echo "Current directory: $(pwd)"
          echo "Git status:"
          git status
          echo "Branches:"
          git branch -a
          echo "Commits in PR:"
          git log ${{ github.event.pull_request.base.ref }}..HEAD --oneline
          echo "=== End Debug ==="
          
          # Ejecutar AutoPR con directorio de trabajo explícito
          autopr generate --no-dry-run --repo-path "$(pwd)"