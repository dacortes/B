name: AutoPR Description
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-description:
    if: github.event.label.name == 'generate-description'
    runs-on: ubuntu-latest
    steps:
      - name: Clean AutoPR cache
        run: |
          rm -rf ~/.local/share/autopr || true
          rm -rf /tmp/autopr-* || true
          rm -rf ~/.cache/autopr || true
          
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Necesario para PRs desde forks
          # allow-unsafe-pr-checkout: true

      - name: Setup Git and create real branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Crear una rama real a partir del SHA
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"
          echo "Creando rama: ${BRANCH_NAME}"
          git checkout -b ${BRANCH_NAME}
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}
          git branch -a
          
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AutoPR
        run: npm install -g autopr

      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ejecutar AutoPR
          autopr generate --no-dry-run