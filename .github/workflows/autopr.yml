name: AutoPR Description
on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-description:
    if: |
      (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'generate-description')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'generate-description')
    runs-on: ubuntu-latest
    steps:
      - name: Clean AutoPR cache
        run: |
          rm -rf ~/.local/share/autopr/repos/worktrees/ || true
          rm -rf /tmp/autopr-* || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify repository status
        run: |
          git status
          git log --oneline -5
          git remote -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AutoPR
        run: npm install -g autopr

      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configurar Git para evitar problemas
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Verificar que hay commits para describir
          if [ -z "$(git log origin/${{ github.event.pull_request.base.ref }}..HEAD --oneline)" ]; then
            echo "No hay commits nuevos en esta rama. El PR está vacío."
            exit 1
          fi
          
          # Ejecutar AutoPR
          autopr generate --no-dry-run