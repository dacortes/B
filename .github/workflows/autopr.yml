name: AutoPR Description
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-description:
    if: github.event.label.name == 'generate-description'
    runs-on: ubuntu-latest
    steps:
      - name: Clean AutoPR cache
        run: |
          rm -rf ~/.local/share/autopr || true
          rm -rf /tmp/autopr-* || true
          
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AutoPR
        run: npm install -g autopr

      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verificar commits
          git fetch origin main:main
          COMMIT_COUNT=$(git log main..HEAD --oneline | wc -l)
          echo "Commits nuevos: ${COMMIT_COUNT}"
          
          if [ ${COMMIT_COUNT} -eq 0 ]; then
            echo "⚠️ No hay commits nuevos en este PR"
            exit 1
          fi
          
          # Ejecutar AutoPR
          autopr generate --no-dry-run