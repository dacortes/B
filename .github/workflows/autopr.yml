name: AutoPR Description
on:
  pull_request:
    types: [opened, labeled] 

permissions:
  contents: read
  pull-requests: write

#test 
jobs:
  generate-description:
    if: |
      (github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'generate-description')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'generate-description')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g autopr
      - name: Generate PR Description
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: autopr generate --no-dry-run